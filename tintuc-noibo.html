<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tin tức — HT HOME Nội bộ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/tokens.css?v=14" />
  <link rel="stylesheet" href="assets/css/base.css?v=14" />
  <link rel="stylesheet" href="assets/css/components.css?v=14" />
  <link rel="stylesheet" href="assets/css/internal.css?v=8" />
  <style>
    .kpi-row { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 560px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1200px) { .kpi-row { grid-template-columns: repeat(4, 1fr); } }
    .kpi { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-l); padding: 18px; box-shadow: var(--shadow-card); }
    .kpi__top { display: flex; align-items: center; justify-content: space-between; color: var(--muted-fg); font-size: 13px; font-weight: 500; }
    .kpi__ic { width: 34px; height: 34px; border-radius: var(--radius-s); background: var(--gold-soft); color: var(--gold-fg); display: inline-flex; align-items: center; justify-content: center; }
    .kpi__val { font-size: 26px; font-weight: 800; color: var(--fg); margin-top: 10px; }
    .kpi__delta { font-size: 12px; margin-top: 4px; color: var(--muted-fg); }

    .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-top: 20px; }
    .tab { flex-shrink: 0; border: 1px solid var(--border); background: var(--card); color: var(--muted-fg); font-family: inherit; font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
    .tab.is-active { background: var(--fg); color: var(--card); border-color: var(--fg); }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-l); box-shadow: var(--shadow-card); margin-top: 16px; }
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table.tt { width: 100%; border-collapse: collapse; min-width: 820px; }
    table.tt th { text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted-fg); padding: 12px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    table.tt td { font-size: 13.5px; color: var(--fg); padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    table.tt tr:last-child td { border-bottom: 0; }
    .tt-art { display: flex; align-items: center; gap: 11px; min-width: 260px; }
    .tt-thumb { width: 54px; height: 38px; border-radius: var(--radius-s); background: linear-gradient(135deg, var(--gold-soft), var(--muted)); background-size: cover; background-position: center; flex-shrink: 0; }
    .tt-name { font-weight: 600; display: block; line-height: 1.3; }
    .tt-slug { font-size: 11.5px; color: var(--muted-fg); }
    .st-badge { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
    .st-badge.published { background: var(--success-soft); color: var(--success); }
    .st-badge.draft { background: var(--warning-soft); color: var(--warning); }
    .st-badge.hidden { background: var(--muted); color: var(--muted-fg); }
    .tt-more { border: 0; background: transparent; color: var(--muted-fg); font-size: 20px; line-height: 1; cursor: pointer; padding: 4px 8px; border-radius: var(--radius-s); }
    .tt-more:hover { background: var(--muted); color: var(--fg); }
    .tt-empty { text-align: center; padding: 44px 20px; color: var(--muted-fg); }
  </style>
</head>
<body>
  <div class="app">
    <div class="app-sidebar" id="ht-sidebar" data-active="tintuc"></div>
    <main class="app-main">
      <header class="app-topbar">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="btn-sidebar" id="btnSidebar" aria-label="Menu"></button>
          <div>
            <div class="app-topbar__title">Tin tức</div>
            <div class="app-topbar__sub">Quản lý bài viết blog công khai</div>
          </div>
        </div>
        <div class="app-topbar__actions">
          <a class="btn btn--primary btn--sm" id="btnNew" href="soanbai.html"></a>
        </div>
      </header>

      <div class="app-content">
        <div class="kpi-row" id="kpiRow"></div>
        <div class="tabs" id="tabs"></div>
        <section class="card">
          <div class="table-wrap">
            <table class="tt">
              <thead>
                <tr><th>Bài viết</th><th>Chuyên mục</th><th>Tác giả</th><th>Ngày đăng</th><th>Lượt xem</th><th>Trạng thái</th><th></th></tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="assets/js/ht-ui.js?v=14"></script>
  <script src="assets/js/ht-internal.js?v=14"></script>
  <script>
    (function () {
      'use strict';
      var I = HTI.icon;
      var esc = (window.HT && HT.esc) ? HT.esc : function (s) { return String(s == null ? '' : s); };
      document.getElementById('btnSidebar').innerHTML = I('menu', 22);
      document.getElementById('btnNew').innerHTML = I('plus', 16) + 'Viết bài mới';

      var CATS = { kinhnghiem: 'Kinh nghiệm', thitruong: 'Thị trường', huongdan: 'Hướng dẫn', tincongty: 'Tin công ty' };
      var ST = { published: 'Đã đăng', draft: 'Nháp', hidden: 'Đã ẩn' };
      var arts = [], state = { tab: 'all' };

      function fmtDate(s) { if (!s) return '—'; var p = String(s).slice(0, 10).split('-'); return p.length === 3 ? (p[2] + '/' + p[1] + '/' + p[0]) : s; }
      function bg(url) { return url ? ' style="background-image:url(\'' + esc(url) + '\')"' : ''; }

      function load() {
        fetch('/api/tin-tuc?all=1').then(function (r) { return r.json(); }).then(function (rows) {
          arts = Array.isArray(rows) ? rows : [];
          renderAll();
        }).catch(function () { HT.toast('Không tải được tin tức', 'danger'); });
      }

      function renderKpi() {
        var pub = arts.filter(function (a) { return a.trang_thai === 'published'; }).length;
        var draft = arts.filter(function (a) { return a.trang_thai === 'draft'; }).length;
        var views = arts.reduce(function (s, a) { return s + (a.luot_xem || 0); }, 0);
        var data = [
          { label: 'Tổng bài viết', ic: 'megaphone', val: arts.length, delta: 'Tất cả trạng thái' },
          { label: 'Đã đăng', ic: 'file-text', val: pub, delta: 'Đang hiển thị công khai' },
          { label: 'Bản nháp', ic: 'file-text', val: draft, delta: 'Chưa xuất bản' },
          { label: 'Tổng lượt xem', ic: 'users', val: views.toLocaleString('vi-VN'), delta: 'Toàn bộ bài đăng' }
        ];
        document.getElementById('kpiRow').innerHTML = data.map(function (k) {
          return '<div class="kpi"><div class="kpi__top"><span>' + k.label + '</span><span class="kpi__ic">' + I(k.ic, 18) + '</span></div>' +
            '<div class="kpi__val">' + k.val + '</div><div class="kpi__delta">' + k.delta + '</div></div>';
        }).join('');
      }

      function renderTabs() {
        function cnt(fn) { return arts.filter(fn).length; }
        var defs = [
          { key: 'all', label: 'Tất cả (' + arts.length + ')' },
          { key: 'published', label: 'Đã đăng (' + cnt(function (a) { return a.trang_thai === 'published'; }) + ')' },
          { key: 'draft', label: 'Nháp (' + cnt(function (a) { return a.trang_thai === 'draft'; }) + ')' },
          { key: 'hidden', label: 'Đã ẩn (' + cnt(function (a) { return a.trang_thai === 'hidden'; }) + ')' }
        ];
        document.getElementById('tabs').innerHTML = defs.map(function (t) {
          return '<button class="tab' + (t.key === state.tab ? ' is-active' : '') + '" data-key="' + t.key + '">' + t.label + '</button>';
        }).join('');
        document.querySelectorAll('.tab').forEach(function (b) {
          b.addEventListener('click', function () { state.tab = b.getAttribute('data-key'); renderTabs(); renderRows(); });
        });
      }

      function renderRows() {
        var list = arts.filter(function (a) { return state.tab === 'all' || a.trang_thai === state.tab; });
        var tb = document.getElementById('rows');
        if (!list.length) { tb.innerHTML = '<tr><td colspan="7"><div class="tt-empty">Chưa có bài viết nào.</div></td></tr>'; return; }
        tb.innerHTML = list.map(function (a) {
          return '<tr>' +
            '<td><div class="tt-art"><div class="tt-thumb"' + bg(a.anh_bia) + '></div>' +
              '<div><span class="tt-name">' + esc(a.tieu_de) + '</span><span class="tt-slug">/' + esc(a.slug || '') + '</span></div></div></td>' +
            '<td>' + (CATS[a.chuyen_muc] || '—') + '</td>' +
            '<td>' + esc(a.tac_gia || 'HT HOME') + '</td>' +
            '<td>' + fmtDate(a.published_at) + '</td>' +
            '<td>' + (a.luot_xem || 0) + '</td>' +
            '<td><span class="st-badge ' + a.trang_thai + '">' + (ST[a.trang_thai] || a.trang_thai) + '</span></td>' +
            '<td style="text-align:right"><button class="tt-more" data-id="' + a.id + '">⋮</button></td>' +
          '</tr>';
        }).join('');
      }

      function renderAll() { renderKpi(); renderTabs(); renderRows(); }

      // Menu hành động mỗi bài
      document.getElementById('rows').addEventListener('click', function (ev) {
        var btn = ev.target.closest ? ev.target.closest('.tt-more') : null;
        if (!btn) return;
        var a = arts.filter(function (x) { return String(x.id) === btn.getAttribute('data-id'); })[0];
        if (!a || !HT.modal) return;
        var isPub = a.trang_thai === 'published';
        HT.modal({
          title: a.tieu_de, sub: (CATS[a.chuyen_muc] || '') + ' · ' + (ST[a.trang_thai] || ''), submitLabel: null,
          bodyHTML: '<div style="display:flex;flex-direction:column;gap:8px">' +
            '<a class="btn btn--ghost" href="soanbai.html?id=' + a.id + '" style="justify-content:flex-start">Sửa bài viết</a>' +
            (a.trang_thai !== 'published' ? '<button class="btn btn--ghost" data-act="pub" type="button" style="justify-content:flex-start;color:var(--success)">Xuất bản</button>' : '') +
            (a.slug ? '<a class="btn btn--ghost" href="bai-viet.html?slug=' + encodeURIComponent(a.slug) + '" target="_blank" style="justify-content:flex-start">Xem bài công khai</a>' : '') +
            (isPub ? '<button class="btn btn--ghost" data-act="hide" type="button" style="justify-content:flex-start">Ẩn bài</button>' : '') +
            '<button class="btn btn--ghost" data-act="del" type="button" style="justify-content:flex-start;color:var(--danger)">Xoá bài</button>' +
          '</div>'
        });
        var backdrops = document.querySelectorAll('.modal-backdrop');
        var md = backdrops[backdrops.length - 1];
        if (!md) return;
        md.addEventListener('click', function (ex) {
          var t = ex.target.closest ? ex.target.closest('[data-act]') : null;
          if (!t) return;
          var act = t.getAttribute('data-act');
          if (act === 'del') {
            md.querySelector('.modal__close').click();
            HT.confirm({
              title: 'Xoá bài viết', message: 'Xoá vĩnh viễn "' + a.tieu_de + '"? Không thể hoàn tác.', danger: true, confirmLabel: 'Xoá',
              onConfirm: function () {
                fetch('/api/tin-tuc', { method: 'DELETE', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: a.id }) })
                  .then(function () { HT.toast('Đã xoá bài viết', 'warning'); load(); }).catch(function () { HT.toast('Lỗi xoá', 'danger'); });
              }
            });
          } else {
            var newSt = act === 'pub' ? 'published' : 'hidden';
            md.querySelector('.modal__close').click();
            fetch('/api/tin-tuc', { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: a.id, trang_thai: newSt }) })
              .then(function () { HT.toast(act === 'pub' ? 'Đã xuất bản' : 'Đã ẩn bài', 'success'); load(); }).catch(function () { HT.toast('Lỗi cập nhật', 'danger'); });
          }
        });
      });

      load();
    })();
  </script>
</body>
</html>
