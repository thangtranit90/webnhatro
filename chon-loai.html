<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chọn loại tin — HT HOME</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--blue:#1f5fd6;--blue-dark:#164bad;--navy:#132a5e;--orange:#ff6a00;--ink:#1f2a44;--muted:#6b7488;--line:#e7ebf3;--bg:#eef1f7}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Be Vietnam Pro",system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh}
  a{text-decoration:none;color:inherit}
  .topbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px}
  .topbar .back{display:flex;align-items:center;gap:7px;color:var(--muted);font-weight:600;font-size:14px}
  .topbar .back:hover{color:var(--blue)}
  .topbar .back svg{width:18px;height:18px}
  .topbar img{height:34px}

  .wrap{max-width:960px;margin:0 auto;padding:44px 24px}
  .head{text-align:center;margin-bottom:34px}
  .head h1{font-size:26px;font-weight:800;color:var(--navy);margin-bottom:8px}
  .head p{color:var(--muted);font-size:15px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .type-card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:24px 22px;cursor:pointer;transition:.16s;display:flex;flex-direction:column;gap:12px}
  .type-card:hover{border-color:var(--blue);box-shadow:0 12px 30px rgba(19,42,94,.12);transform:translateY(-3px)}
  .tc-ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center}
  .tc-ic svg{width:26px;height:26px}
  .type-card h3{font-size:17px;font-weight:700;color:var(--navy)}
  .type-card p{font-size:13px;color:var(--muted);line-height:1.5;flex:1}
  .tc-tags{font-size:12px;color:var(--blue);font-weight:600}
  .tc-go{display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-weight:600;font-size:14px}
  .tc-go svg{width:16px;height:16px}
  .c-blue{background:#eaf1ff;color:var(--blue)} .c-green{background:#e8f8ef;color:#0f9d58}
  .c-orange{background:#fff1e6;color:var(--orange)} .c-purple{background:#f0ebfd;color:#7c3aed}
  .c-teal{background:#e6f7f6;color:#0d9488}
  @media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg> Quản lý</a>
    <img src="ht-home-logo.png" alt="HT HOME">
  </div>

  <div class="wrap">
    <div class="head">
      <h1>Bạn muốn đăng loại tin nào?</h1>
      <p>Chọn loại sản phẩm cho thuê — mỗi loại có bộ đặc điểm và phân loại riêng.</p>
    </div>
    <div class="grid" id="grid"></div>
  </div>

<script src="data.js"></script>
<script>
  const TYPES = [
    ['Phòng trọ','c-blue','<path d="M3 10 12 3l9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/>','Phòng cho thuê theo tháng, có/không nội thất.'],
    ['Căn hộ dịch vụ','c-purple','<path d="M3 21h18M5 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M9 7h.01M13 7h.01M9 11h.01M13 11h.01"/>','Căn hộ có dịch vụ dọn phòng, lễ tân, thang máy.'],
    ['Ký túc xá','c-orange','<path d="M3 7h18M5 7v13M19 7v13M3 20h18M8 11h3v3H8zM13 11h3v3h-3z"/>','Phòng ghép theo số người, giá theo đầu người.'],
    ['Chung cư','c-teal','<path d="M4 21V4a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v17M15 21V9h4a1 1 0 0 1 1 1v11M7 7h.01M11 7h.01M7 11h.01M11 11h.01M7 15h.01M11 15h.01"/>','Căn hộ chung cư, phân theo số phòng ngủ.'],
    ['Nhà nguyên căn','c-green','<path d="M3 10 12 3l9 7M5 9v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M9 21v-6h6v6"/>','Nhà cho thuê nguyên căn, nhiều tầng/phòng.'],
  ];
  const TYPE_TAGS = window.TYPE_TAGS || {};
  document.getElementById('grid').innerHTML = TYPES.map(([name,cls,ic,desc])=>{
    const groups = Object.keys(TYPE_TAGS[name]||{}).join(' · ');
    return `<a class="type-card" href="them-tin.html?type=${encodeURIComponent(name)}">
      <div class="tc-ic ${cls}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ic}</svg></div>
      <h3>${name}</h3>
      <p>${desc}</p>
      <div class="tc-tags">${groups}</div>
      <div class="tc-go">Chọn loại này <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
    </a>`;
  }).join('');
</script>
</body>
</html>
