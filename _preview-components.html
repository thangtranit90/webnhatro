<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xem thử component — HT HOME</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/tokens.css?v=4" />
  <link rel="stylesheet" href="assets/css/base.css?v=4" />
  <link rel="stylesheet" href="assets/css/components.css?v=4" />
</head>
<body>
  <div id="ht-header" data-active="home"></div>

  <main class="container" style="padding-block:32px;display:flex;flex-direction:column;gap:32px">
    <section>
      <h1 class="t-display" style="margin-bottom:4px">Nền tảng giao diện — HT HOME</h1>
      <p class="t-caption">Navy + Gold · Inter — dựng từ thiết kế nhatro.pen</p>
    </section>

    <section>
      <h2 class="t-heading" style="margin-bottom:12px">Nút &amp; Badge</h2>
      <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
        <button class="btn btn--primary" id="b1"></button>
        <button class="btn btn--gold">Ưu đãi</button>
        <button class="btn btn--ghost">Xem thêm</button>
        <span class="badge badge--success"><span class="badge__dot"></span>Còn trống</span>
        <span class="badge badge--warning"><span class="badge__dot"></span>Sắp đầy</span>
        <span class="badge badge--danger"><span class="badge__dot"></span>Hết phòng</span>
        <span class="badge badge--info"><span class="badge__dot"></span>Mới</span>
        <span class="avatar">MT</span>
      </div>
    </section>

    <section>
      <div class="section__head">
        <h2 class="t-heading">Thẻ phòng</h2>
        <a class="section__link" href="#">Xem tất cả</a>
      </div>
      <div class="room-grid" id="cards"></div>
    </section>
  </main>

  <div id="ht-footer"></div>

  <script src="assets/js/ht-ui.js?v=5"></script>
  <script>
    document.getElementById('b1').innerHTML = HT.icon('plus', 16) + 'Đăng tin';
    var rooms = [
      { img:'https://picsum.photos/seed/htr1/320/200', price:'2,8 triệu', type:'Duplex', title:'Duplex Full nội thất · Nguyễn Oanh', addr:'P.17, Gò Vấp, TP.HCM', area:'20 m²', beds:'1 PN', baths:'1 WC', status:'Còn trống', statusKey:'success', video:true },
      { img:'https://picsum.photos/seed/htr2/320/200', price:'1,4 triệu', type:'KTX', title:'Ký túc xá máy lạnh · Huỳnh Khương An', addr:'P.8, Gò Vấp, TP.HCM', area:'18 m²', beds:'Ở ghép', baths:'Chung', status:'Còn trống', statusKey:'success' },
      { img:'https://picsum.photos/seed/htr3/320/200', price:'4,5 triệu', type:'CHDV', title:'Căn hộ dịch vụ ban công · Phan Văn Trị', addr:'P.5, Gò Vấp, TP.HCM', area:'32 m²', beds:'1 PN', baths:'1 WC', status:'Sắp đầy', statusKey:'warning', video:true },
      { img:'https://picsum.photos/seed/htr4/320/200', price:'3,2 triệu', type:'Phòng trọ', title:'Phòng trọ mới xây · Lê Đức Thọ', addr:'P.13, Gò Vấp, TP.HCM', area:'24 m²', beds:'1 PN', baths:'1 WC', status:'Hết phòng', statusKey:'danger' }
    ];
    document.getElementById('cards').innerHTML = rooms.map(HT.roomCard).join('');
  </script>
</body>
</html>
