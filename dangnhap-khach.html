<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập — HT HOME</title>
  <meta name="description" content="Đăng nhập tài khoản HT HOME bằng số điện thoại và mật khẩu." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/tokens.css?v=13" />
  <link rel="stylesheet" href="assets/css/base.css?v=13" />
  <link rel="stylesheet" href="assets/css/components.css?v=13" />
  <style>
    .login { padding-block: 40px 64px; }
    @media (min-width: 1024px) { .login { padding-block: 64px 88px; } }
    .login__wrap { max-width: 440px; margin-inline: auto; }
    .form-panel {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-l);
      padding: 30px 24px;
    }
    @media (min-width: 640px) { .form-panel { padding: 38px 34px; } }
    .form-panel__h { font-size: 24px; font-weight: 800; letter-spacing: -.01em; color: var(--fg); text-align: center; }
    .form-panel__sub { font-size: 14px; line-height: 1.6; color: var(--muted-fg); margin-top: 8px; text-align: center; }
    .field { margin-top: 20px; }
    .field__label { display: block; font-size: 13px; font-weight: 700; color: var(--fg); margin-bottom: 8px; }
    .field__input {
      width: 100%; border: 1px solid var(--input); border-radius: var(--radius-s);
      padding: 12px 14px; font-size: 15px; color: var(--fg); background: var(--card);
    }
    .field__input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--gold-soft); }
    .field__row { display: flex; justify-content: flex-end; margin-top: 8px; }
    .field__row a { font-size: 13px; color: var(--primary); font-weight: 600; }
    .field__row a:hover { text-decoration: underline; }
    .form-panel__submit { margin-top: 24px; }
    .form-panel__error { color: var(--danger); font-size: 13px; font-weight: 600; margin-top: 12px; min-height: 18px; }
    .form-panel__foot { font-size: 14px; color: var(--muted-fg); margin-top: 20px; text-align: center; }
    .form-panel__foot a { color: var(--primary); font-weight: 700; }
    .form-panel__foot a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div id="ht-header" data-active=""></div>

  <main>
    <section class="login">
      <div class="container login__wrap">
        <div class="form-panel">
          <h1 class="form-panel__h">Đăng nhập</h1>
          <p class="form-panel__sub">Chào mừng bạn quay lại HT HOME</p>

          <form id="loginForm" novalidate>
            <div class="field">
              <label class="field__label" for="fPhone">Số điện thoại</label>
              <input class="field__input" type="tel" id="fPhone" name="phone" placeholder="09xx xxx xxx" autocomplete="tel" inputmode="tel" />
            </div>

            <div class="field">
              <label class="field__label" for="fPass">Mật khẩu</label>
              <input class="field__input" type="password" id="fPass" name="password" placeholder="Mật khẩu" autocomplete="current-password" />
              <div class="field__row"><a href="quenmatkhau.html">Quên mật khẩu?</a></div>
            </div>

            <div class="form-panel__error" id="formError" role="alert"></div>

            <button class="btn btn--primary btn--block form-panel__submit" type="submit">Đăng nhập</button>
          </form>

          <p class="form-panel__foot">Chưa có tài khoản? <a href="dangky.html">Đăng ký ngay</a></p>
        </div>
      </div>
    </section>
  </main>

  <div id="ht-footer"></div>

  <script src="assets/js/ht-ui.js?v=13"></script>
  <script>
  (function () {
    'use strict';
    var form = document.getElementById('loginForm');
    var errEl = document.getElementById('formError');
    var btn = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var phone = document.getElementById('fPhone').value.trim();
      var pass = document.getElementById('fPass').value;

      if (!phone) { errEl.textContent = 'Vui lòng nhập số điện thoại.'; document.getElementById('fPhone').focus(); return; }
      if (!pass) { errEl.textContent = 'Vui lòng nhập mật khẩu.'; document.getElementById('fPass').focus(); return; }
      errEl.textContent = '';
      btn.disabled = true; var oldTxt = btn.textContent; btn.textContent = 'Đang đăng nhập…';

      fetch('/api/auth-khach', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ action: 'login', sdt: phone, mat_khau: pass })
      }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (res) {
          if (!res.ok) { errEl.textContent = res.d.error || 'Đăng nhập thất bại.'; btn.disabled = false; btn.textContent = oldTxt; return; }
          try { localStorage.setItem('ht_user', JSON.stringify(res.d.user || { phone: phone })); } catch (_) {}
          window.location.href = 'taikhoan.html';
        })
        .catch(function () { errEl.textContent = 'Lỗi kết nối, vui lòng thử lại.'; btn.disabled = false; btn.textContent = oldTxt; });
    });
  })();
  </script>
</body>
</html>
