<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quỹ nội bộ · Tài chính công ty — HT HOME Nội bộ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/tokens.css?v=4" />
  <link rel="stylesheet" href="assets/css/base.css?v=4" />
  <link rel="stylesheet" href="assets/css/components.css?v=4" />
  <link rel="stylesheet" href="assets/css/internal.css?v=4" />
  <style>
    /* KPI: 4 thẻ số dư */
    .kpi-row { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 560px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1200px) { .kpi-row { grid-template-columns: repeat(4, 1fr); } }
    .kpi { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-l); padding: 18px; box-shadow: var(--shadow-card); }
    .kpi__top { display: flex; align-items: center; justify-content: space-between; color: var(--muted-fg); font-size: 13px; font-weight: 500; }
    .kpi__ic { width: 34px; height: 34px; border-radius: var(--radius-s); background: var(--gold-soft); color: var(--gold); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .kpi__val { font-size: 25px; font-weight: 800; color: var(--fg); margin-top: 10px; }
    .kpi__delta { font-size: 12px; margin-top: 4px; color: var(--muted-fg); }
    .kpi__delta .up { color: var(--success); font-weight: 700; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-l); box-shadow: var(--shadow-card); }
    .card__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--border); }
    .card__head h3 { font-size: 16px; font-weight: 700; color: var(--fg); }
    .card__head .sub { font-size: 12px; color: var(--muted-fg); margin-top: 2px; }
    .card__link { font-size: 13px; font-weight: 600; color: var(--muted-fg); display: inline-flex; align-items: center; gap: 4px; }
    .card__link:hover { color: var(--fg); }
    .card__body { padding: 8px 20px 16px; }

    .cols { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 20px; }
    @media (min-width: 1100px) { .cols { grid-template-columns: 1.6fr 1fr; } }

    /* Giao dịch */
    .tx { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--border); }
    .tx:last-child { border-bottom: 0; }
    .tx__ic { width: 36px; height: 36px; border-radius: var(--radius-s); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .tx__ic--in { background: var(--success-soft); color: var(--success); }
    .tx__ic--out { background: var(--danger-soft); color: var(--danger); }
    .tx__body { flex: 1; min-width: 0; }
    .tx__t { font-size: 13.5px; font-weight: 600; color: var(--fg); display: block; }
    .tx__s { font-size: 12px; color: var(--muted-fg); display: block; margin-top: 2px; }
    .tx__amt { font-size: 14px; font-weight: 800; white-space: nowrap; flex-shrink: 0; }
    .tx__amt--in { color: var(--success); }
    .tx__amt--out { color: var(--danger); }

    /* HH chờ release */
    .rel { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .rel:last-child { border-bottom: 0; }
    .rel__body { flex: 1; min-width: 0; }
    .rel__t { font-size: 13.5px; font-weight: 600; color: var(--fg); display: block; }
    .rel__s { font-size: 12px; color: var(--gold); font-weight: 600; display: block; margin-top: 2px; }
    .rel__amt { font-size: 13.5px; font-weight: 700; color: var(--fg); white-space: nowrap; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="app">
    <div class="app-sidebar" id="ht-sidebar" data-active="quy"></div>
    <main class="app-main">
      <!-- Topbar -->
      <header class="app-topbar">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="btn-sidebar" id="btnSidebar" aria-label="Menu"></button>
          <div>
            <div class="app-topbar__title">Quỹ nội bộ · Tài chính công ty</div>
            <div class="app-topbar__sub">Số dư · Thu chi · HH chưa release · Chu kỳ tháng 7/2026</div>
          </div>
        </div>
        <div class="app-topbar__actions">
          <button class="btn btn--ghost btn--sm" type="button" id="btnExcel"></button>
          <button class="btn btn--primary btn--sm" type="button" id="btnAdd"></button>
        </div>
      </header>

      <div class="app-content">
        <!-- KPI số dư -->
        <div class="kpi-row" id="kpiRow"></div>

        <div class="cols">
          <!-- Giao dịch gần đây -->
          <section class="card">
            <div class="card__head">
              <div><h3>Giao dịch gần đây</h3></div>
              <a class="card__link" href="#" id="linkAll">Xem tất cả</a>
            </div>
            <div class="card__body" id="txList"></div>
          </section>

          <!-- HH chờ release -->
          <section class="card">
            <div class="card__head">
              <div><h3>HH chờ release</h3><div class="sub">12 deal · 45tr</div></div>
            </div>
            <div class="card__body" id="relList"></div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/js/ht-ui.js?v=4"></script>
  <script src="assets/js/ht-internal.js?v=4"></script>
  <script>
    (function () {
      'use strict';
      var I = HTI.icon;
      document.getElementById('btnSidebar').innerHTML = I('menu', 22);
      document.getElementById('btnExcel').innerHTML = I('file-text', 16) + 'Xuất Excel';
      document.getElementById('btnAdd').innerHTML = I('plus', 16) + 'Thêm giao dịch';
      // arrow-right không có trong HTI → inline SVG
      var arrow = '<svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';
      document.getElementById('linkAll').insertAdjacentHTML('beforeend', arrow);

      // KPI số dư
      var thuTotal = 487000000, chiTotal = 163000000;
      function fmtTr(n) { return Math.round(n / 1e6) + ' tr'; }
      function fmtVN(n) { return Number(n).toLocaleString('vi-VN'); }
      var kpis = [
        { label: 'Số dư quỹ', ic: 'banknote', val: '324 tr', delta: '<span class="up">+22%</span> so T6' },
        { label: 'Đã thu tháng 7', ic: 'wallet', key: 'thu', val: '487 tr', delta: '42 giao dịch' },
        { label: 'Đã chi tháng 7', ic: 'file-text', key: 'chi', val: '163 tr', delta: 'Lương + Marketing + OpEx' },
        { label: 'HH chưa release', ic: 'users', val: '45 tr', delta: '12 deal chờ checkin +7' }
      ];
      document.getElementById('kpiRow').innerHTML = kpis.map(function (k) {
        return '<div class="kpi"><div class="kpi__top"><span>' + k.label + '</span><span class="kpi__ic">' + I(k.ic, 18) + '</span></div>' +
          '<div class="kpi__val"' + (k.key ? ' data-kpi="' + k.key + '"' : '') + '>' + k.val + '</div><div class="kpi__delta">' + k.delta + '</div></div>';
      }).join('');

      // Giao dịch gần đây — nạp thật từ D1 (dir: 'in' | 'out')
      var txs = [];
      function renderTx(x) {
        var isIn = x.dir === 'in';
        var ic = isIn ? 'wallet' : 'file-text';
        return '<div class="tx">' +
          '<span class="tx__ic ' + (isIn ? 'tx__ic--in' : 'tx__ic--out') + '">' + I(ic, 18) + '</span>' +
          '<span class="tx__body"><span class="tx__t">' + HT.esc(x.t) + '</span><span class="tx__s">' + HT.esc(x.s) + '</span></span>' +
          '<span class="tx__amt ' + (isIn ? 'tx__amt--in' : 'tx__amt--out') + '">' + HT.esc(x.amt) + '</span>' +
          '</div>';
      }
      function renderTxList() {
        document.getElementById('txList').innerHTML = txs.slice(0, 6).map(renderTx).join('');
      }
      // 1 dòng D1 → 1 giao dịch hiển thị
      function fmtDDMM(s) { if (!s) return ''; var p = String(s).split('-'); return p.length === 3 ? p[2] + '/' + p[1] : ''; }
      function rowToTx(r) {
        var isIn = r.loai === 'thu';
        var dd = fmtDDMM(r.ngay);
        var s = (r.kenh || '') + (dd ? ((r.kenh ? ' · ' : '') + dd) : '');
        return { id: r.id, dir: isIn ? 'in' : 'out', t: r.noi_dung, s: s, amt: (isIn ? '+' : '−') + fmtVN(r.so_tien) };
      }
      function loadTx() {
        return fetch('/api/giao-dich').then(function (r) { return r.json(); }).then(function (rows) {
          if (!Array.isArray(rows)) rows = [];
          txs = rows.map(rowToTx);
          renderTxList();
        }).catch(function () { HT.toast('Không tải được giao dịch', 'danger'); });
      }
      loadTx();

      // HH chờ release
      var rels = [
        { t: '#1042 · Vũ Bảo Ngọc', s: 'Release +7 ngày', amt: '840.000' },
        { t: '#1045 · Đặng Thu Trang', s: 'Release +5 ngày', amt: '1.120.000' },
        { t: '#1048 · Lý Hoàng Nam', s: 'Release +7 ngày', amt: '760.000' },
        { t: '#1050 · Bùi Khánh Vy', s: 'Release +3 ngày', amt: '1.280.000' },
        { t: '#1052 · Ngô Gia Bảo', s: 'Release +6 ngày', amt: '520.000' }
      ];
      document.getElementById('relList').innerHTML = rels.map(function (r) {
        return '<div class="rel">' +
          '<span class="rel__body"><span class="rel__t">' + r.t + '</span><span class="rel__s">' + r.s + '</span></span>' +
          '<span class="rel__amt">' + r.amt + '</span>' +
          '</div>';
      }).join('');

      document.getElementById('btnExcel').addEventListener('click', function () {
        HT.toast('Đang xuất… (demo)', 'success');
      });

      document.getElementById('btnAdd').addEventListener('click', function () {
        var body =
          '<div class="mfield"><label class="mfield__label">Loại</label>' +
            '<select id="fLoai"><option value="in">Thu</option><option value="out">Chi</option></select></div>' +
          '<div class="mfield"><label class="mfield__label">Nội dung</label>' +
            '<input id="fND" type="text" placeholder="VD: HH deal #1055 (Nguyễn An · P.210)"/></div>' +
          '<div class="mrow">' +
            '<div class="mfield"><label class="mfield__label">Số tiền (đ)</label>' +
              '<input id="fST" type="number" min="0" placeholder="1000000"/></div>' +
            '<div class="mfield"><label class="mfield__label">Kênh</label>' +
              '<select id="fKenh"><option>Chuyển khoản</option><option>Tiền mặt</option></select></div>' +
          '</div>' +
          '<div class="mfield"><label class="mfield__label">Ngày</label>' +
            '<input id="fNgay" type="date"/></div>';
        HT.modal({
          title: 'Thêm giao dịch', sub: 'Ghi nhận thu/chi vào quỹ nội bộ',
          submitLabel: 'Thêm', bodyHTML: body,
          onSubmit: function (m, close) {
            var loai = m.querySelector('#fLoai').value;   // 'in' | 'out'
            var nd = m.querySelector('#fND').value.trim();
            var st = parseInt(m.querySelector('#fST').value, 10);
            var kenh = m.querySelector('#fKenh').value;
            var ngay = m.querySelector('#fNgay').value;    // yyyy-mm-dd
            if (!nd) { HT.toast('Nhập nội dung giao dịch', 'danger'); return false; }
            if (!st || st <= 0) { HT.toast('Nhập số tiền hợp lệ', 'danger'); return false; }
            fetch('/api/giao-dich', {
              method: 'POST', headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ loai: loai === 'in' ? 'thu' : 'chi', noi_dung: nd, so_tien: st, kenh: kenh, ngay: ngay })
            }).then(function (r) { return r.json(); }).then(function (res) {
              if (res && res.error) { HT.toast(res.error, 'danger'); return; }
              close();
              HT.toast('Đã thêm giao dịch', 'success');
              loadTx();
            }).catch(function () { HT.toast('Lỗi mạng, chưa lưu được', 'danger'); });
            return false;
          }
        });
      });

      function renderTxRow(x) {
        var isIn = x.dir === 'in';
        var ic = isIn ? 'wallet' : 'file-text';
        return '<div class="tx">' +
          '<span class="tx__ic ' + (isIn ? 'tx__ic--in' : 'tx__ic--out') + '">' + I(ic, 18) + '</span>' +
          '<span class="tx__body"><span class="tx__t">' + HT.esc(x.t) + '</span><span class="tx__s">' + HT.esc(x.s) + '</span></span>' +
          '<span class="tx__amt ' + (isIn ? 'tx__amt--in' : 'tx__amt--out') + '">' + HT.esc(x.amt) + '</span>' +
          '<button class="btn btn--ghost btn--sm" type="button" data-del="' + x.id + '" style="color:var(--danger);flex-shrink:0">Xoá</button>' +
          '</div>';
      }
      function delTx(id, close) {
        HT.confirm({
          title: 'Xoá giao dịch', message: 'Xoá phiếu này?', danger: true, confirmLabel: 'Xoá',
          onConfirm: function () {
            fetch('/api/giao-dich', { method: 'DELETE', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: id }) })
              .then(function (r) { return r.json(); })
              .then(function (res) {
                if (res && res.error) { HT.toast(res.error, 'danger'); return; }
                HT.toast('Đã xoá', 'success');
                if (close) close();
                loadTx();
              })
              .catch(function () { HT.toast('Lỗi mạng', 'danger'); });
          }
        });
      }
      document.getElementById('linkAll').addEventListener('click', function (e) {
        e.preventDefault();
        var m = HT.modal({
          title: 'Tất cả giao dịch', sub: txs.length + ' giao dịch', wide: true, submitLabel: null,
          bodyHTML: '<div style="max-height:60vh;overflow:auto">' + txs.map(renderTxRow).join('') + '</div>'
        });
        m.el.addEventListener('click', function (ev) {
          var btn = ev.target.closest('[data-del]');
          if (!btn) return;
          delTx(btn.getAttribute('data-del'), m.close);
        });
      });
    })();
  </script>
</body>
</html>
