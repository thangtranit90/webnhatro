<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phân quyền vai trò — HT HOME Nội bộ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/internal.css" />
  <style>
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-l); box-shadow: var(--shadow-card); }
    .card__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--border); }
    .card__head h3 { font-size: 16px; font-weight: 700; color: var(--fg); }
    .card__head .sub { font-size: 12px; color: var(--muted-fg); margin-top: 2px; }

    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table.pq { width: 100%; border-collapse: collapse; min-width: 720px; }
    table.pq th, table.pq td { padding: 12px 14px; border-bottom: 1px solid var(--border); text-align: center; }
    table.pq thead th { position: sticky; top: 0; background: var(--card); }
    table.pq th.fn, table.pq td.fn { text-align: left; white-space: nowrap; }
    table.pq thead th { font-size: 12px; font-weight: 700; color: var(--fg); }
    table.pq thead th.fn { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted-fg); }
    .pq-role-cnt { display: block; font-size: 11px; font-weight: 500; color: var(--muted-fg); margin-top: 2px; }
    /* Hàng nhóm */
    tr.pq-group td { background: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted-fg); text-align: left; padding: 9px 14px; }
    td.fn { font-size: 13.5px; color: var(--fg); }
    /* Checkbox */
    .pq-chk { width: 18px; height: 18px; accent-color: var(--gold); cursor: pointer; }
  </style>
</head>
<body>
  <div class="app">
    <div class="app-sidebar" id="ht-sidebar" data-active="phanquyen"></div>
    <main class="app-main">
      <!-- Topbar -->
      <header class="app-topbar">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="btn-sidebar" id="btnSidebar" aria-label="Menu"></button>
          <div>
            <div class="app-topbar__title">Phân quyền vai trò</div>
            <div class="app-topbar__sub">4 vai trò · 18 chức năng · Áp dụng cho toàn hệ thống</div>
          </div>
        </div>
        <div class="app-topbar__actions">
          <button class="btn btn--primary btn--sm" id="btnSave" type="button">Lưu thay đổi</button>
        </div>
      </header>

      <div class="app-content">
        <section class="card">
          <div class="card__head">
            <div>
              <h3>Ma trận phân quyền</h3>
              <div class="sub">Tick để bật quyền cho từng vai trò — Admin mặc định có đủ mọi quyền</div>
            </div>
          </div>
          <div class="table-wrap">
            <table class="pq">
              <thead>
                <tr>
                  <th class="fn">Chức năng</th>
                  <th>Sale cấp 1<span class="pq-role-cnt">4 người</span></th>
                  <th>Sale cấp 2<span class="pq-role-cnt">8 người</span></th>
                  <th>Manager<span class="pq-role-cnt">1 người</span></th>
                  <th>Admin<span class="pq-role-cnt">1 người</span></th>
                </tr>
              </thead>
              <tbody id="pqBody"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="assets/js/ht-ui.js"></script>
  <script src="assets/js/ht-internal.js"></script>
  <script>
    (function () {
      'use strict';
      var I = HTI.icon;
      document.getElementById('btnSidebar').innerHTML = I('menu', 22);

      // Ma trận: mỗi hàng [tên chức năng, sale1, sale2, manager, admin]
      // Admin luôn đủ tất cả. Sale1 quyền cơ bản, Sale2 nhiều hơn, Manager gần đủ.
      var groups = [
        { name: 'Phòng & tòa nhà', rows: [
          ['Xem giỏ hàng phòng',      1, 1, 1, 1],
          ['Thêm/sửa phòng',          0, 1, 1, 1],
          ['Xoá phòng',               0, 0, 1, 1],
          ['Xem thông tin chủ nhà',   0, 1, 1, 1],
          ['Sửa ma trận hoa hồng',    0, 0, 1, 1]
        ] },
        { name: 'Khách hàng & deal', rows: [
          ['Xem CRM',                 1, 1, 1, 1],
          ['Thêm/sửa khách',          1, 1, 1, 1],
          ['Chốt deal',               1, 1, 1, 1],
          ['Xem hoa hồng deal',       1, 1, 1, 1],
          ['Duyệt release HH',        0, 0, 1, 1]
        ] },
        { name: 'Báo cáo & quản trị', rows: [
          ['Xem báo cáo cá nhân',     1, 1, 1, 1],
          ['Xem báo cáo tổng',        0, 0, 1, 1],
          ['Quản lý nhân viên',       0, 0, 1, 1],
          ['Phân quyền',              0, 0, 0, 1],
          ['Quản lý quỹ',            0, 0, 1, 1],
          ['Cài đặt hệ thống',        0, 0, 0, 1]
        ] }
      ];

      function cell(on) {
        return '<td><input class="pq-chk" type="checkbox"' + (on ? ' checked' : '') + ' /></td>';
      }

      var html = '';
      groups.forEach(function (g) {
        html += '<tr class="pq-group"><td colspan="5">' + g.name + '</td></tr>';
        g.rows.forEach(function (r) {
          html += '<tr><td class="fn">' + r[0] + '</td>' +
            cell(r[1]) + cell(r[2]) + cell(r[3]) + cell(r[4]) + '</tr>';
        });
      });
      document.getElementById('pqBody').innerHTML = html;

      document.getElementById('btnSave').addEventListener('click', function () {
        alert('Đã lưu thay đổi phân quyền (demo).');
      });
    })();
  </script>
</body>
</html>
