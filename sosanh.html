<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>So sánh phòng — HT HOME</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/tokens.css?v=10" />
  <link rel="stylesheet" href="assets/css/base.css?v=10" />
  <link rel="stylesheet" href="assets/css/components.css?v=10" />
  <style>
    .breadcrumb { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--muted-fg); margin-bottom: 12px; }
    .breadcrumb a:hover { color: var(--fg); }
    .breadcrumb .sep { color: var(--input); }
    .breadcrumb .cur { color: var(--fg); font-weight: 600; }
    .ss-head { margin-bottom: 20px; }
    .ss-title { font-size: 24px; font-weight: 800; color: var(--fg); }
    .ss-sub { font-size: 14px; color: var(--muted-fg); margin-top: 4px; }
    .ss-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--border); border-radius: var(--radius-l); background: var(--card); box-shadow: var(--shadow-card); }
    table.ss { width: 100%; border-collapse: collapse; min-width: 640px; }
    table.ss td, table.ss th { padding: 14px 16px; border-bottom: 1px solid var(--border); vertical-align: top; text-align: left; }
    table.ss tr:last-child td { border-bottom: 0; }
    .ss-rowlb { font-size: 13px; font-weight: 700; color: var(--muted-fg); width: 130px; background: var(--bg); white-space: nowrap; }
    .ss-media { display: block; width: 100%; height: 130px; border-radius: var(--radius-m); overflow: hidden; background: var(--muted); }
    .ss-media img { width: 100%; height: 100%; object-fit: cover; }
    .ss-media .grad { display: block; width: 100%; height: 100%; }
    .ss-name { font-size: 14px; font-weight: 700; color: var(--fg); margin-top: 10px; line-height: 1.3; }
    .ss-price { font-size: 18px; font-weight: 800; color: var(--fg); }
    .ss-val { font-size: 14px; color: var(--fg); }
    .ss-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .ss-tag { font-size: 11px; font-weight: 600; background: var(--muted); color: var(--muted-fg); border-radius: 999px; padding: 3px 9px; }
    .ss-cta { display: flex; flex-direction: column; gap: 8px; }
    .ss-empty { text-align: center; padding: 60px 20px; color: var(--muted-fg); }
  </style>
</head>
<body>
  <div id="ht-header" data-active="search"></div>

  <main>
    <section class="section">
      <div class="container">
        <nav class="breadcrumb">
          <a href="index.html">Trang chủ</a><span class="sep">/</span>
          <a href="timphong.html">Tìm phòng</a><span class="sep">/</span>
          <span class="cur">So sánh phòng</span>
        </nav>
        <div class="ss-head">
          <div class="ss-title">So sánh phòng</div>
          <div class="ss-sub" id="ssSub"></div>
        </div>
        <div id="ssContent"></div>
      </div>
    </section>
  </main>

  <div id="ht-footer"></div>

  <script src="data.js"></script>
  <script src="assets/js/ht-ui.js?v=10"></script>
  <script>
    (function () {
      var esc = HT.esc;
      function catOfR(r) { return window.catOf ? window.catOf(r) : (r.cat || r.ty); }
      function media(img) {
        if (img && /^(https?:|\/)/i.test(img)) return '<span class="ss-media"><img src="' + esc(img) + '" alt=""></span>';
        if (img && img.indexOf('#') === 0) {
          var cols = img.split(',').map(function (s) { return s.trim(); });
          var bg = cols.length > 1 ? 'linear-gradient(135deg,' + cols.join(',') + ')' : cols[0];
          return '<span class="ss-media"><span class="grad" style="background:' + bg + '"></span></span>';
        }
        return '<span class="ss-media"></span>';
      }

      // Đọc danh sách index phòng từ ?i=0,3,5
      var m = /[?&]i=([^&]*)/.exec(location.search);
      var idxs = m ? decodeURIComponent(m[1]).split(',').map(function (x) { return parseInt(x, 10); }).filter(function (x) { return !isNaN(x); }) : [];
      var ROOMS = window.ROOMS || [];
      var items = idxs.map(function (i) { return { i: i, r: ROOMS[i] }; }).filter(function (e) { return e.r; });

      var sub = document.getElementById('ssSub');
      var content = document.getElementById('ssContent');
      if (!items.length) {
        sub.textContent = '';
        content.innerHTML = '<div class="ss-wrap"><div class="ss-empty">Chưa chọn phòng nào để so sánh.<br><br>' +
          '<a class="btn btn--primary btn--sm" href="timphong.html">Về Tìm phòng chọn phòng</a></div></div>';
        return;
      }
      sub.textContent = 'Đang so sánh ' + items.length + ' phòng cạnh nhau';

      function rowFn(label, fn) {
        return '<tr><td class="ss-rowlb">' + label + '</td>' +
          items.map(function (e) { return '<td>' + fn(e.r, e.i) + '</td>'; }).join('') + '</tr>';
      }
      content.innerHTML = '<div class="ss-wrap"><table class="ss"><tbody>' +
        rowFn('', function (r, i) { return '<a href="detail.html?i=' + i + '">' + media((r.imgs && r.imgs[0]) || '') + '</a>' +
          '<div class="ss-name">' + esc(r.t) + '</div>'; }) +
        rowFn('Giá thuê', function (r) { return '<span class="ss-price">' + esc(r.p) + '</span>'; }) +
        rowFn('Loại', function (r) { return '<span class="ss-val">' + esc(catOfR(r)) + '</span>'; }) +
        rowFn('Diện tích', function (r) { return '<span class="ss-val">' + esc(r.a || '—') + '</span>'; }) +
        rowFn('Địa chỉ', function (r) { return '<span class="ss-val">' + esc(r.l || (r.quan ? r.quan + ', TP.HCM' : '—')) + '</span>'; }) +
        rowFn('Tiện ích', function (r) {
          var t = (r.tags || []).slice(0, 6);
          return t.length ? '<span class="ss-tags">' + t.map(function (x) { return '<span class="ss-tag">' + esc(x) + '</span>'; }).join('') + '</span>' : '<span class="ss-val">—</span>';
        }) +
        rowFn('', function (r, i) {
          return '<div class="ss-cta">' +
            '<a class="btn btn--primary btn--sm" href="detail.html?i=' + i + '" style="justify-content:center">Xem chi tiết</a>' +
            '<a class="btn btn--ghost btn--sm" href="datlich.html" style="justify-content:center">Đặt lịch xem</a></div>';
        }) +
        '</tbody></table></div>';
    })();
  </script>
</body>
</html>
