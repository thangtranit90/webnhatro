# CI/CD: cu push code len nhanh master la web tu dong cap nhat len Cloudflare Pages
name: Deploy len Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch: {} # cho phep bam nut chay tay tren GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy website
    steps:
      - name: Lay code moi nhat
        uses: actions/checkout@v4

      - name: Gom rieng cac file website (khong dua tai lieu noi bo len web)
        run: |
          mkdir -p site-upload
          cp index.html detail.html timphong.html sosanh.html \
             tintuc.html bai-viet.html tintuc-noibo.html soanbai.html \
             gioithieu.html \
             vechungtoi.html dieukhoan.html baomat.html 404.html \
             dangky.html dangnhap-khach.html taikhoan.html chat.html datlich.html \
             dangnhap-noibo.html quenmatkhau.html nhap-otp.html datmatkhau.html \
             dashboard.html khophong.html crm.html deal.html doanhthu.html \
             toanha.html toanha-chitiet.html lichhen.html themphong.html phong-noibo.html \
             baocao.html thongbao.html nhanvien.html phanquyen.html caidat.html bangtin.html \
             chon-loai.html them-tin.html \
             data.js footer.js login.js ht-home-logo.png logo-full-light.png logo-full-dark.png logo-mark.png \
             manifest.json sw.js _headers _redirects \
             site-upload/
          cp -r assets site-upload/
          cp -r functions site-upload/

      - name: Deploy len Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site-upload --project-name=webnhatro --branch=master
