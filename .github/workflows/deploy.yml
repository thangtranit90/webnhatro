# CI/CD: cu push code len nhanh master la web tu dong cap nhat len Cloudflare Pages
name: Deploy len Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch: {} # cho phep bam nut chay tay tren GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy website
    steps:
      - name: Lay code moi nhat
        uses: actions/checkout@v4

      - name: Gom file website (copy ca thu muc, loai tru tai lieu noi bo)
        run: |
          # Copy TOAN BO repo vao site-upload, tru cac thu muc/file khong duoc len web.
          # Them file .html moi -> tu dong len, KHONG can sua file nay nua.
          # DANH SACH LOAI TRU (cap nhat neu them loai file noi bo moi):
          rsync -a --exclude-from=.github/deploy-exclude.txt ./ site-upload/

      - name: Deploy len Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site-upload --project-name=webnhatro --branch=master
