<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Khách hàng (CRM) — HT HOME Nội bộ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/tokens.css?v=4" />
  <link rel="stylesheet" href="assets/css/base.css?v=4" />
  <link rel="stylesheet" href="assets/css/components.css?v=5" />
  <link rel="stylesheet" href="assets/css/internal.css?v=6" />
  <style>
    /* ---- Filters ---- */
    .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 18px; -webkit-overflow-scrolling: touch; }
    .filters::-webkit-scrollbar { height: 0; }
    .chip { flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--muted-fg); font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all .15s; }
    .chip:hover { color: var(--fg); border-color: var(--muted-fg); }
    .chip.is-active { background: var(--fg); color: var(--card); border-color: var(--fg); }

    /* ---- Kanban ---- */
    .kanban { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 12px; -webkit-overflow-scrolling: touch; }
    .kanban::-webkit-scrollbar { height: 8px; }
    .kanban::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }
    .kcol { flex: 0 0 84vw; max-width: 300px; background: var(--muted, #F3F5F8); border: 1px solid var(--border); border-radius: var(--radius-l); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    @media (min-width: 640px) { .kcol { flex-basis: 300px; } }
    .kcol__head { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 6px; }
    .kcol__title { font-size: 14px; font-weight: 700; color: var(--fg); }
    .kcol__count { font-size: 12px; font-weight: 700; color: var(--muted-fg); background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 1px 9px; }

    /* ---- Thẻ khách ---- */
    .kc { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-m, 12px); padding: 12px; box-shadow: var(--shadow-card); cursor: pointer; transition: box-shadow .15s, transform .15s; }
    .kc:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(20,30,50,.08); }
    .kc__top { display: flex; align-items: center; gap: 10px; }
    .kc__name { font-size: 14px; font-weight: 700; color: var(--fg); line-height: 1.2; }
    .kc__phone { font-size: 12px; color: var(--muted-fg); margin-top: 1px; }
    .kc__tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .tag { font-size: 11px; font-weight: 600; border-radius: 999px; padding: 3px 9px; background: var(--muted, #F3F5F8); color: var(--muted-fg); }
    .tag--hot { background: var(--danger-soft); color: var(--danger); }
    .tag--warm { background: var(--warning-soft); color: var(--warning); }
    .tag--cold { background: var(--info-soft); color: var(--info); }
    .kc__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 10px; font-size: 12px; color: var(--muted-fg); }
    .kc__meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--border); display: inline-block; }
    .kc__meta strong { color: var(--fg); font-weight: 600; }

    /* ---- 2 cột: kanban + panel chi tiết (theo v2) ---- */
    .crm-2col { display: flex; gap: 16px; align-items: flex-start; }
    .kanban { flex: 1; min-width: 0; }
    .crm-panel { flex: 0 0 340px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-l); box-shadow: var(--shadow-card); padding: 18px; position: sticky; top: 16px; max-height: calc(100vh - 90px); overflow-y: auto; }
    .crm-panel__empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; color: var(--muted-fg); font-size: 13px; padding: 40px 12px; }
    .crm-panel__empty-ic { width: 52px; height: 52px; border-radius: 999px; background: var(--muted); color: var(--muted-fg); display: inline-flex; align-items: center; justify-content: center; }
    @media (max-width: 1199px) { .crm-panel { display: none; } }
    /* Panel nội dung */
    .cp-sect { margin-top: 16px; }
    .cp-sect__h { font-size: 13px; font-weight: 700; color: var(--fg); margin-bottom: 8px; }
    .cp-appt { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--border); }
    .cp-appt__ic { width: 30px; height: 30px; border-radius: var(--radius-s); background: var(--gold-soft); color: var(--gold); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .cp-appt__t { font-size: 13px; font-weight: 600; color: var(--fg); display: block; }
    .cp-appt__s { font-size: 12px; color: var(--muted-fg); }
    .cp-tl { position: relative; padding-left: 18px; }
    .cp-tl__item { position: relative; padding: 0 0 14px 0; }
    .cp-tl__item::before { content: ''; position: absolute; left: -14px; top: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
    .cp-tl__item::after { content: ''; position: absolute; left: -11px; top: 12px; bottom: -2px; width: 2px; background: var(--border); }
    .cp-tl__item:last-child::after { display: none; }
    .cp-tl__t { font-size: 12px; color: var(--muted-fg); }
    .cp-tl__m { font-size: 13px; color: var(--fg); }
  </style>
</head>
<body>
  <div class="app">
    <div class="app-sidebar" id="ht-sidebar" data-active="crm"></div>
    <main class="app-main">
      <!-- Topbar -->
      <header class="app-topbar">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="btn-sidebar" id="btnSidebar" aria-label="Menu"></button>
          <div>
            <div class="app-topbar__title">Khách hàng</div>
            <div class="app-topbar__sub">8 khách đang chăm · 2 sắp hết khóa 30 ngày</div>
          </div>
        </div>
        <div class="app-topbar__actions">
          <button class="btn btn--primary btn--sm" id="btnAdd">Thêm khách</button>
        </div>
      </header>

      <div class="app-content">
        <!-- Chip lọc -->
        <div class="filters" id="filters"></div>

        <!-- 2 cột: Kanban + Panel chi tiết (theo v2) -->
        <div class="crm-2col">
          <div class="kanban" id="kanban"></div>
          <aside class="crm-panel" id="crmPanel">
            <div class="crm-panel__empty">
              <span class="crm-panel__empty-ic" id="panelEmptyIc"></span>
              <div>Chọn một khách để xem chi tiết,<br>lịch hẹn và lịch sử tương tác</div>
            </div>
          </aside>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/js/ht-ui.js?v=5"></script>
  <script src="assets/js/ht-internal.js?v=4"></script>
  <script>
    var I = HTI.icon;
    var esc = HT.esc;
    document.getElementById('btnSidebar').innerHTML = I('menu', 22);
    document.getElementById('btnAdd').innerHTML = I('plus', 16) + 'Thêm khách';
    document.getElementById('panelEmptyIc').innerHTML = I('users', 22);

    // Lịch hẹn (để panel chi tiết hiển thị lịch của từng khách)
    var APPTS = [];
    fetch('/api/lich-hen').then(function (r) { return r.json(); }).then(function (rows) { APPTS = Array.isArray(rows) ? rows : []; }).catch(function () {});
    var ST_LH = { xacnhan: 'Đã xác nhận', cho: 'Chờ xác nhận', huy: 'Đã huỷ' };

    /* ---- Dữ liệu mẫu ---- */
    // heat: 'hot' | 'warm' | 'cold'  → tự map ra nhãn + màu
    // mine: khách của tôi · exp: sắp hết khóa (demo) · history: lịch sử tương tác
    var HEAT = {
      hot:  { label: 'Hot 🔥',   cls: 'tag--hot' },
      warm: { label: 'Warm 🌤️', cls: 'tag--warm' },
      cold: { label: 'Cold ❄️', cls: 'tag--cold' }
    };
    /* ---- 5 cột kanban gắn với mã cột trong D1 ---- */
    var COT2TITLE = { moi: 'Khách mới', tuvan: 'Đã tư vấn', guiphong: 'Đã gửi phòng', danxem: 'Đã dẫn xem', chot: 'Đã chốt' };
    var COT_ORDER = ['moi', 'tuvan', 'guiphong', 'danxem', 'chot'];
    var TITLE2COT = {}; COT_ORDER.forEach(function (k) { TITLE2COT[COT2TITLE[k]] = k; });
    var columns = COT_ORDER.map(function (k) { return { title: COT2TITLE[k], cot: k, cards: [] }; });

    var cardMap = {};

    /* Thời gian tương đối từ created_at (UTC) */
    function relTime(s) {
      if (!s) return '';
      var then = Date.parse(String(s).replace(' ', 'T') + 'Z');
      if (isNaN(then)) return '';
      var m = Math.floor(Math.max(0, Date.now() - then) / 60000);
      if (m < 1) return 'Vừa xong';
      if (m < 60) return m + ' phút';
      var h = Math.floor(m / 60); if (h < 24) return h + ' giờ';
      return Math.floor(h / 24) + ' ngày';
    }

    /* 1 dòng D1 → 1 thẻ khách */
    function rowToCard(r) {
      return {
        id: 'c' + r.id, dbid: r.id,
        av: initials(r.ten), name: r.ten, phone: r.sdt,
        type: r.loai || '—', heat: r.nhiet || 'warm',
        budget: r.ngan_sach || '—', source: r.nguon || '—',
        time: relTime(r.created_at) || 'Mới', mine: true, exp: false,
        col: COT2TITLE[r.cot] || 'Khách mới'
      };
    }

    /* Tải danh sách khách từ D1 và dựng lại kanban */
    function loadCustomers() {
      return fetch('/api/khach').then(function (r) { return r.json(); }).then(function (rows) {
        if (!Array.isArray(rows)) rows = [];
        cardMap = {};
        columns.forEach(function (col) { col.cards = []; });
        rows.forEach(function (r) {
          var c = rowToCard(r); cardMap[c.id] = c;
          var col = columns.filter(function (x) { return x.cot === (r.cot || 'moi'); })[0] || columns[0];
          col.cards.push(c);
        });
        var sub = document.querySelector('.app-topbar__sub');
        if (sub) sub.textContent = rows.length + ' khách đang chăm';
        renderFilters();
        renderKanban();
      }).catch(function () { HT.toast('Không tải được danh sách khách', 'danger'); });
    }

    function initials(name) {
      var p = String(name || '').trim().split(/\s+/);
      if (!p.length) return '?';
      return (p.length === 1 ? p[0].slice(0, 2) : p[p.length - 2].charAt(0) + p[p.length - 1].charAt(0)).toUpperCase();
    }

    function cardHTML(c) {
      var h = HEAT[c.heat] || HEAT.cold;
      return '<div class="kc" data-id="' + c.id + '" data-heat="' + c.heat + '"' +
        ' data-mine="' + (c.mine ? '1' : '0') + '" data-exp="' + (c.exp ? '1' : '0') + '">' +
        '<div class="kc__top">' +
          '<span class="avatar">' + esc(c.av) + '</span>' +
          '<span style="flex:1;min-width:0">' +
            '<span class="kc__name" style="display:block">' + esc(c.name) + '</span>' +
            '<span class="kc__phone">' + esc(c.phone) + '</span>' +
          '</span>' +
        '</div>' +
        '<div class="kc__tags">' +
          '<span class="tag">' + esc(c.type) + '</span>' +
          '<span class="tag ' + h.cls + '">' + h.label + '</span>' +
        '</div>' +
        '<div class="kc__meta">' +
          '<span><strong>' + esc(c.budget) + '</strong></span><span class="dot"></span>' +
          '<span>' + esc(c.source) + '</span><span class="dot"></span>' +
          '<span>' + esc(c.time) + '</span>' +
        '</div>' +
      '</div>';
    }

    var elKanban = document.getElementById('kanban');
    function renderKanban() {
      elKanban.innerHTML = columns.map(function (col) {
        return '<div class="kcol">' +
          '<div class="kcol__head"><span class="kcol__title">' + esc(col.title) + '</span>' +
          '<span class="kcol__count">' + col.cards.length + '</span></div>' +
          col.cards.map(cardHTML).join('') +
        '</div>';
      }).join('');
      applyFilter(); // giữ nguyên bộ lọc đang chọn sau khi render lại
    }

    /* ---- Chip lọc (chạy THẬT) ---- */
    var filters = [
      { t: 'Tất cả',      key: 'all',  active: true },
      { t: 'Của tôi',     key: 'mine' },
      { t: 'Sắp hết khóa', key: 'exp' },
      { t: 'Hot 🔥',      key: 'hot' },
      { t: 'Warm 🌤️',    key: 'warm' },
      { t: 'Cold ❄️',    key: 'cold' }
    ];
    function filterCount(key) {
      var n = 0;
      columns.forEach(function (col) {
        col.cards.forEach(function (c) {
          if (key === 'all') n++;
          else if (key === 'mine') { if (c.mine) n++; }
          else if (key === 'exp') { if (c.exp) n++; }
          else if (c.heat === key) n++;
        });
      });
      return n;
    }
    var elFilters = document.getElementById('filters');
    function renderFilters() {
      elFilters.innerHTML = filters.map(function (f) {
        return '<button class="chip' + (f.active ? ' is-active' : '') + '" data-key="' + f.key + '">' +
          f.t + ' (' + filterCount(f.key) + ')</button>';
      }).join('');
    }
    function currentKey() {
      var active = elFilters.querySelector('.chip.is-active');
      return active ? active.getAttribute('data-key') : 'all';
    }
    function applyFilter() {
      var key = currentKey();
      elKanban.querySelectorAll('.kc').forEach(function (el) {
        var show = key === 'all' ||
          (key === 'mine' && el.getAttribute('data-mine') === '1') ||
          (key === 'exp' && el.getAttribute('data-exp') === '1') ||
          (el.getAttribute('data-heat') === key);
        el.style.display = show ? '' : 'none';
      });
    }
    elFilters.addEventListener('click', function (e) {
      var chip = e.target.closest('.chip');
      if (!chip) return;
      elFilters.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('is-active'); });
      chip.classList.add('is-active');
      applyFilter();
    });
    renderFilters();

    /* ---- Bấm thẻ khách → modal Chi tiết ---- */
    var STAGES = columns.map(function (col) { return col.title; });
    function detailBody(c) {
      var h = HEAT[c.heat] || HEAT.cold;
      var tel = 'tel:' + String(c.phone || '').replace(/[^0-9+]/g, '');
      var history = [
        { t: c.time, m: 'Khách để lại thông tin qua ' + c.source },
        { t: 'Gần đây', m: 'NV đã gọi tư vấn, khách quan tâm phòng ' + c.budget },
        { t: 'Ghi chú', m: 'Ưu tiên nhắn Zalo trong giờ hành chính' }
      ];
      var hist = history.map(function (x) {
        return '<div style="display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--border)">' +
          '<span style="flex-shrink:0;width:64px;font-size:12px;color:var(--muted-fg)">' + esc(x.t) + '</span>' +
          '<span style="font-size:13px;color:var(--fg)">' + esc(x.m) + '</span></div>';
      }).join('');
      return '' +
        '<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">' +
          '<span class="avatar" style="width:44px;height:44px;font-size:15px">' + esc(c.av) + '</span>' +
          '<div><div style="font-size:16px;font-weight:700;color:var(--fg)">' + esc(c.name) + '</div>' +
          '<div style="font-size:13px;color:var(--muted-fg)">' + esc(c.phone) + '</div></div>' +
        '</div>' +
        '<div class="kc__tags" style="margin:0 0 12px">' +
          '<span class="tag">' + esc(c.type) + '</span>' +
          '<span class="tag ' + h.cls + '">' + h.label + '</span>' +
          '<span class="tag">' + esc(c.col) + '</span>' +
        '</div>' +
        '<div class="kc__meta" style="margin:0 0 14px">' +
          '<span>Ngân sách <strong>' + esc(c.budget) + '</strong></span><span class="dot"></span>' +
          '<span>Nguồn: ' + esc(c.source) + '</span><span class="dot"></span>' +
          '<span>' + esc(c.time) + '</span>' +
        '</div>' +
        '<div style="display:flex;gap:8px;margin-bottom:16px">' +
          '<a class="btn btn--primary btn--sm" href="' + esc(tel) + '" style="flex:1;justify-content:center">Gọi</a>' +
          '<button class="btn btn--ghost btn--sm" id="d_zalo" style="flex:1;justify-content:center">Nhắn Zalo</button>' +
          '<button class="btn btn--ghost btn--sm" id="d_lich" style="flex:1;justify-content:center">Đặt lịch xem</button>' +
        '</div>' +
        '<div style="display:flex;margin-bottom:16px">' +
          '<button class="btn btn--primary btn--sm" id="d_del" style="flex:1;justify-content:center;background:var(--danger);border-color:var(--danger)">Xoá khách</button>' +
        '</div>' +
        '<div style="font-size:13px;font-weight:700;color:var(--fg);margin-bottom:2px">Lịch sử tương tác</div>' +
        hist;
    }
    // ---- Panel chi tiết bên phải (desktop) ----
    var elPanel = document.getElementById('crmPanel');
    var panelActive = null;
    function panelVisible() { return getComputedStyle(elPanel).display !== 'none'; }

    function apptRows(c) {
      var mine = APPTS.filter(function (a) { return (a.khach || '').trim() === (c.name || '').trim(); });
      if (!mine.length) return '<div style="font-size:12px;color:var(--muted-fg);padding:6px 0">Chưa có lịch hẹn.</div>';
      return mine.map(function (a) {
        return '<div class="cp-appt"><span class="cp-appt__ic">' + I('calendar-days', 15) + '</span>' +
          '<span><span class="cp-appt__t">' + esc(a.phong || 'Xem phòng') + '</span>' +
          '<span class="cp-appt__s">' + esc((a.ngay || '') + (a.gio ? ' · ' + a.gio + 'h' : '') + ' · ' + (ST_LH[a.trang_thai] || '')) + '</span></span></div>';
      }).join('');
    }
    function timeline(c) {
      var items = [
        { t: c.time, m: 'Khách để lại thông tin qua ' + c.source },
        { t: 'Gần đây', m: 'NV đã gọi tư vấn · quan tâm phòng ' + c.budget },
        { t: 'Ghi chú', m: 'Ưu tiên nhắn Zalo trong giờ hành chính' }
      ];
      return '<div class="cp-tl">' + items.map(function (x) {
        return '<div class="cp-tl__item"><div class="cp-tl__t">' + esc(x.t) + '</div><div class="cp-tl__m">' + esc(x.m) + '</div></div>';
      }).join('') + '</div>';
    }
    function fillPanel(c) {
      panelActive = c;
      var h = HEAT[c.heat] || HEAT.cold;
      var tel = 'tel:' + String(c.phone || '').replace(/[^0-9+]/g, '');
      var idx = STAGES.indexOf(c.col);
      var nextLabel = (idx >= 0 && idx < STAGES.length - 1) ? ('Chuyển → ' + STAGES[idx + 1]) : 'Đã ở bước cuối';
      elPanel.innerHTML =
        '<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">' +
          '<span class="avatar" style="width:44px;height:44px;font-size:15px">' + esc(c.av) + '</span>' +
          '<div><div style="font-size:16px;font-weight:700;color:var(--fg)">' + esc(c.name) + '</div>' +
          '<div style="font-size:13px;color:var(--muted-fg)">' + esc(c.phone) + '</div></div></div>' +
        '<div class="kc__tags" style="margin:0 0 12px">' +
          '<span class="tag">' + esc(c.type) + '</span>' +
          '<span class="tag ' + h.cls + '">' + h.label + '</span>' +
          '<span class="tag">' + esc(c.col) + '</span></div>' +
        '<div class="kc__meta" style="margin:0 0 14px">' +
          '<span>Ngân sách <strong>' + esc(c.budget) + '</strong></span><span class="dot"></span>' +
          '<span>Nguồn: ' + esc(c.source) + '</span></div>' +
        '<div style="display:flex;gap:8px;margin-bottom:10px">' +
          '<a class="btn btn--primary btn--sm" href="' + esc(tel) + '" style="flex:1;justify-content:center">Gọi</a>' +
          '<button class="btn btn--ghost btn--sm" data-p="zalo" style="flex:1;justify-content:center">Zalo</button>' +
          '<button class="btn btn--ghost btn--sm" data-p="lich" style="flex:1;justify-content:center">Đặt lịch</button></div>' +
        '<button class="btn btn--primary btn--sm btn--block" data-p="next"' + (nextLabel.indexOf('Chuyển') === 0 ? '' : ' disabled style="opacity:.5"') + '>' + esc(nextLabel) + '</button>' +
        '<div class="cp-sect"><div class="cp-sect__h">Lịch hẹn</div>' + apptRows(c) + '</div>' +
        '<div class="cp-sect"><div class="cp-sect__h">Lịch sử tương tác</div>' + timeline(c) + '</div>' +
        '<div class="cp-sect"><button class="btn btn--sm btn--block" data-p="del" style="background:var(--danger);color:#fff">Xoá khách</button></div>';
    }
    elPanel.addEventListener('click', panelClick);
    function panelClick(e) {
      var b = e.target.closest('[data-p]'); if (!b || !panelActive) return;
      var c = panelActive, act = b.getAttribute('data-p');
      if (act === 'zalo') return HT.toast('Đang mở Zalo tới ' + c.name + '…', 'success');
      if (act === 'lich') return HT.toast('Đã tạo lịch xem phòng cho ' + c.name, 'success');
      if (act === 'next') {
        var idx = STAGES.indexOf(c.col);
        if (idx < 0 || idx >= STAGES.length - 1) return;
        moveCard(c, STAGES[idx + 1]);
        HT.toast('Đã chuyển "' + c.name + '" → ' + STAGES[idx + 1], 'success');
        c.col = STAGES[idx + 1]; fillPanel(c);
      }
      if (act === 'del') {
        HT.confirm({ title: 'Xoá khách', message: 'Xoá "' + c.name + '"? Không khôi phục được.', danger: true, confirmLabel: 'Xoá', onConfirm: function () {
          if (!c.dbid) { HT.toast('Khách chưa lưu', 'danger'); return; }
          fetch('/api/khach', { method: 'DELETE', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: c.dbid }) })
            .then(function (r) { return r.json(); }).then(function (res) {
              if (res && res.ok) { HT.toast('Đã xoá khách', 'success'); elPanel.innerHTML = ''; panelActive = null; loadCustomers(); }
              else HT.toast((res && res.error) || 'Lỗi xoá', 'danger');
            }).catch(function () { HT.toast('Lỗi mạng', 'danger'); });
        } });
      }
    }

    elKanban.addEventListener('click', function (e) {
      var el = e.target.closest('.kc');
      if (!el) return;
      var c = cardMap[el.getAttribute('data-id')];
      if (!c) return;
      if (panelVisible()) { fillPanel(c); return; }
      var detailModal = HT.modal({
        title: 'Chi tiết khách', sub: c.name,
        bodyHTML: detailBody(c),
        submitLabel: 'Chuyển bước',
        onSubmit: function (m, close) {
          var idx = STAGES.indexOf(c.col);
          if (idx < 0 || idx >= STAGES.length - 1) {
            HT.toast('Khách đã ở bước cuối', 'warning');
            return true;
          }
          moveCard(c, STAGES[idx + 1]);
          HT.toast('Đã chuyển "' + c.name + '" → ' + STAGES[idx + 1], 'success');
          return true;
        }
      });
      var m = document.querySelector('.modal-backdrop.is-open') || document.querySelector('.modal-backdrop');
      if (m) {
        var z = m.querySelector('#d_zalo'); if (z) z.addEventListener('click', function () { HT.toast('Đang mở Zalo tới ' + c.name + '…', 'success'); });
        var l = m.querySelector('#d_lich'); if (l) l.addEventListener('click', function () { HT.toast('Đã tạo lịch xem phòng cho ' + c.name, 'success'); });
        var d = m.querySelector('#d_del'); if (d) d.addEventListener('click', function () {
          HT.confirm({
            title: 'Xoá khách',
            message: 'Xoá "' + c.name + '" khỏi hệ thống? Không khôi phục được.',
            danger: true,
            confirmLabel: 'Xoá',
            onConfirm: function () {
              if (!c.dbid) { HT.toast('Khách chưa lưu trên hệ thống', 'danger'); return; }
              fetch('/api/khach', {
                method: 'DELETE',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ id: c.dbid })
              }).then(function (r) { return r.json(); }).then(function (res) {
                if (res && res.ok) {
                  if (detailModal && detailModal.close) detailModal.close();
                  HT.toast('Đã xoá khách', 'success');
                  loadCustomers();
                } else {
                  HT.toast((res && res.error) || 'Lỗi xoá', 'danger');
                }
              }).catch(function () { HT.toast('Lỗi mạng', 'danger'); });
            }
          });
        });
      }
    });

    function moveCard(c, toTitle) {
      var from = columns.filter(function (col) { return col.title === c.col; })[0];
      var to = columns.filter(function (col) { return col.title === toTitle; })[0];
      if (!from || !to) return;
      from.cards = from.cards.filter(function (x) { return x.id !== c.id; });
      c.col = toTitle;
      to.cards.push(c);
      renderFilters();
      renderKanban();
      if (c.dbid) {
        fetch('/api/khach', {
          method: 'PATCH', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ id: c.dbid, cot: TITLE2COT[toTitle] || 'moi' })
        }).catch(function () { HT.toast('Lỗi lưu bước, thử lại', 'danger'); });
      }
    }

    /* ---- Nút "Thêm khách" → modal form ---- */
    document.getElementById('btnAdd').addEventListener('click', function () {
      var typeOpts = ['🎓 SV', '💼 Đi làm', '🌏 Nước ngoài'].map(function (o) { return '<option>' + o + '</option>'; }).join('');
      var heatOpts = '<option value="hot">Hot 🔥</option><option value="warm" selected>Warm 🌤️</option><option value="cold">Cold ❄️</option>';
      var srcOpts = ['Facebook', 'TikTok', 'SEO Google', 'Referral'].map(function (o) { return '<option>' + o + '</option>'; }).join('');
      HT.modal({
        title: 'Thêm khách', sub: 'Khách sẽ vào cột "Khách mới"',
        submitLabel: 'Lưu khách',
        bodyHTML:
          '<div class="mrow">' +
            '<div class="mfield"><label class="mfield__label">Họ tên *</label><input id="f_ten" placeholder="Nguyễn Văn A"></div>' +
            '<div class="mfield"><label class="mfield__label">Số điện thoại *</label><input id="f_sdt" placeholder="09xx xxx xxx"></div>' +
          '</div>' +
          '<div class="mrow">' +
            '<div class="mfield"><label class="mfield__label">Loại khách</label><select id="f_type">' + typeOpts + '</select></div>' +
            '<div class="mfield"><label class="mfield__label">Nhiệt</label><select id="f_heat">' + heatOpts + '</select></div>' +
          '</div>' +
          '<div class="mrow">' +
            '<div class="mfield"><label class="mfield__label">Ngân sách</label><input id="f_budget" placeholder="3-4 tr"></div>' +
            '<div class="mfield"><label class="mfield__label">Nguồn</label><select id="f_source">' + srcOpts + '</select></div>' +
          '</div>' +
          '<div class="mrow">' +
            '<div class="mfield"><label class="mfield__label">Email</label><input id="f_email" type="email" placeholder="ten@email.com"></div>' +
            '<div class="mfield"><label class="mfield__label">Sale phụ trách</label><input id="f_sale" placeholder="Tên nhân viên sale"></div>' +
          '</div>' +
          '<div class="mfield"><label class="mfield__label">Hạn chuyển bước</label><input id="f_deadline" type="date"></div>' +
          '<div class="mfield"><label class="mfield__label" style="display:flex;align-items:center;gap:8px;cursor:pointer">' +
            '<input id="f_zalo" type="checkbox" style="width:auto">Gửi form đăng ký qua Zalo cho khách</label></div>',
        onSubmit: function (m, close) {
          var ten = (m.querySelector('#f_ten').value || '').trim();
          var sdt = (m.querySelector('#f_sdt').value || '').trim();
          if (!ten) { HT.toast('Vui lòng nhập họ tên', 'danger'); return false; }
          if (!sdt) { HT.toast('Vui lòng nhập số điện thoại', 'danger'); return false; }
          var payload = {
            ten: ten, sdt: sdt,
            loai: m.querySelector('#f_type').value,
            nhiet: m.querySelector('#f_heat').value,
            ngan_sach: (m.querySelector('#f_budget').value || '').trim(),
            nguon: m.querySelector('#f_source').value,
            email: (m.querySelector('#f_email').value || '').trim(),
            sale: (m.querySelector('#f_sale').value || '').trim(),
            deadline: m.querySelector('#f_deadline').value || '',
            cot: 'moi'
          };
          if (m.querySelector('#f_zalo').checked) HT.toast('Đã gửi form đăng ký qua Zalo cho khách', 'success');
          fetch('/api/khach', {
            method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify(payload)
          }).then(function (r) { return r.json(); }).then(function (res) {
            if (res && res.error) { HT.toast(res.error, 'danger'); return; }
            close();
            HT.toast('Đã thêm khách', 'success');
            loadCustomers();
          }).catch(function () { HT.toast('Lỗi mạng, chưa lưu được', 'danger'); });
          return false;
        }
      });
    });

    loadCustomers();
  </script>
</body>
</html>
