<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deal & Hợp đồng — HT HOME Nội bộ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/tokens.css?v=9" />
  <link rel="stylesheet" href="assets/css/base.css?v=9" />
  <link rel="stylesheet" href="assets/css/components.css?v=9" />
  <link rel="stylesheet" href="assets/css/internal.css?v=6" />
  <style>
    .kpi-row { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 560px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1200px) { .kpi-row { grid-template-columns: repeat(4, 1fr); } }
    .kpi { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-l); padding: 18px; box-shadow: var(--shadow-card); }
    .kpi__top { display: flex; align-items: center; justify-content: space-between; color: var(--muted-fg); font-size: 13px; font-weight: 500; }
    .kpi__ic { width: 34px; height: 34px; border-radius: var(--radius-s); background: var(--gold-soft); color: var(--gold-fg); display: inline-flex; align-items: center; justify-content: center; }
    .kpi__val { font-size: 24px; font-weight: 800; color: var(--fg); margin-top: 10px; }
    .kpi__delta { font-size: 12px; margin-top: 4px; color: var(--muted-fg); }

    .tabs { display: flex; flex-wrap: wrap; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-top: 20px; }
    .tab { flex-shrink: 0; border: 1px solid var(--border); background: var(--card); color: var(--muted-fg); font: inherit; font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
    .tab.is-active { background: var(--fg); color: var(--card); border-color: var(--fg); }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-l); box-shadow: var(--shadow-card); margin-top: 16px; }
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table.dl { width: 100%; border-collapse: collapse; min-width: 860px; }
    table.dl th { text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted-fg); padding: 12px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    table.dl td { font-size: 13.5px; color: var(--fg); padding: 13px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: middle; }
    table.dl tr:last-child td { border-bottom: 0; }
    .dl-khach { display: flex; align-items: center; gap: 10px; }
    .dl-khach__n { font-weight: 600; display: block; }
    .dl-khach__s { font-size: 12px; color: var(--muted-fg); }
    .dl-num { font-weight: 700; }
    .dl-hh { color: var(--gold-fg); font-weight: 700; }
    .badge-st { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 3px 10px; }
    .st-coc { background: var(--warning-soft); color: var(--warning); }
    .st-chot { background: var(--info-soft); color: var(--info); }
    .st-release { background: var(--success-soft); color: var(--success); }
    .st-huy { background: var(--muted); color: var(--muted-fg); }
    .dl-more { border: 0; background: transparent; color: var(--muted-fg); font-size: 20px; line-height: 1; cursor: pointer; padding: 4px 8px; border-radius: var(--radius-s); }
    .dl-more:hover { background: var(--muted); color: var(--fg); }
    .dl-empty { text-align: center; padding: 40px 20px; color: var(--muted-fg); font-size: 14px; }
    .dl-menu { position: absolute; z-index: 50; min-width: 180px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-m); box-shadow: var(--shadow-card); padding: 6px; }
    .dl-menu button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: transparent; border: 0; border-radius: var(--radius-s); padding: 9px 10px; font: inherit; font-size: 13px; font-weight: 600; color: var(--fg); cursor: pointer; }
    .dl-menu button:hover { background: var(--bg); }
  </style>
</head>
<body>
  <div class="app">
    <div class="app-sidebar" id="ht-sidebar" data-active="deal"></div>
    <main class="app-main">
      <header class="app-topbar">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="btn-sidebar" id="btnSidebar" aria-label="Menu"></button>
          <div>
            <div class="app-topbar__title">Deal &amp; Hợp đồng</div>
            <div class="app-topbar__sub" id="dlSub">Theo dõi giao dịch từ tư vấn đến chốt hợp đồng</div>
          </div>
        </div>
        <div class="app-topbar__actions">
          <button class="btn btn--primary btn--sm" id="btnAdd" type="button"></button>
        </div>
      </header>

      <div class="app-content">
        <div class="kpi-row" id="kpiRow"></div>
        <div class="tabs" id="tabs"></div>
        <section class="card">
          <div class="table-wrap">
            <table class="dl">
              <thead>
                <tr>
                  <th>Khách</th><th>Phòng</th><th>Toà nhà</th><th>Sale</th>
                  <th>Giá trị</th><th>Hoa hồng</th><th>Trạng thái</th><th></th>
                </tr>
              </thead>
              <tbody id="dlRows"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="assets/js/ht-ui.js?v=9"></script>
  <script src="assets/js/ht-internal.js?v=9"></script>
  <script>
    (function () {
      'use strict';
      var I = HTI.icon, esc = HT.esc;
      document.getElementById('btnSidebar').innerHTML = I('menu', 22);
      document.getElementById('btnAdd').innerHTML = I('plus', 16) + 'Chốt deal mới';

      var ST = {
        coc: { label: 'Đang cọc', cls: 'st-coc' },
        chot: { label: 'Đã chốt', cls: 'st-chot' },
        release: { label: 'Đã release', cls: 'st-release' },
        huy: { label: 'Huỷ', cls: 'st-huy' }
      };
      function fmtVN(n) { return Number(n || 0).toLocaleString('vi-VN'); }
      function fmtTr(n) { return (Math.round((n || 0) / 1e5) / 10) + ' tr'; }
      function initials(name) {
        var p = String(name || '').trim().split(/\s+/);
        return (p.length === 1 ? p[0].slice(0, 2) : p[p.length - 2].charAt(0) + p[p.length - 1].charAt(0)).toUpperCase();
      }

      var deals = [];
      var state = { tab: 'all' };
      // Phân quyền: sale chỉ thấy deal của mình
      var me = null; try { me = JSON.parse(localStorage.getItem('ht_staff')); } catch (e) {}
      var isSale = me && me.roleKey !== 'admin';
      if (isSale) {
        document.querySelector('.app-topbar__title').textContent = 'Deal của tôi';
        document.getElementById('dlSub').textContent = 'Deal do bạn phụ trách';
      }

      function loadDeals() {
        return fetch('/api/deal').then(function (r) { return r.json(); }).then(function (rows) {
          rows = Array.isArray(rows) ? rows : [];
          if (isSale) rows = rows.filter(function (d) { return (d.sale || '').trim() === (me.name || '').trim(); });
          deals = rows;
          renderAll();
        }).catch(function () { HT.toast('Không tải được danh sách deal', 'danger'); });
      }

      // ---- KPI ----
      function renderKpi() {
        var giaTri = deals.reduce(function (s, d) { return s + (Number(d.gia_tri) || 0); }, 0);
        var hh = deals.reduce(function (s, d) { return s + (Number(d.hh) || 0); }, 0);
        var choRelease = deals.filter(function (d) { return d.trang_thai === 'chot'; }).length;
        var kpis = [
          { label: 'Tổng deal', ic: 'file-text', val: deals.length, delta: 'Tất cả trạng thái' },
          { label: 'Tổng giá trị', ic: 'wallet', val: fmtTr(giaTri), delta: 'Giá thuê/tháng' },
          { label: 'Tổng hoa hồng', ic: 'banknote', val: fmtTr(hh), delta: 'Toàn đội' },
          { label: 'Chờ release', ic: 'shield-check', val: choRelease, delta: 'Deal đã chốt' }
        ];
        document.getElementById('kpiRow').innerHTML = kpis.map(function (k) {
          return '<div class="kpi"><div class="kpi__top"><span>' + k.label + '</span><span class="kpi__ic">' + I(k.ic, 18) + '</span></div>' +
            '<div class="kpi__val">' + k.val + '</div><div class="kpi__delta">' + k.delta + '</div></div>';
        }).join('');
      }

      // ---- Tabs ----
      function tabDefs() {
        function cnt(k) { return k === 'all' ? deals.length : deals.filter(function (d) { return d.trang_thai === k; }).length; }
        return [
          { k: 'all', label: 'Tất cả' }, { k: 'coc', label: 'Đang cọc' },
          { k: 'chot', label: 'Đã chốt' }, { k: 'release', label: 'Đã release' }, { k: 'huy', label: 'Huỷ' }
        ].map(function (t) { t.n = cnt(t.k); return t; });
      }
      function renderTabs() {
        document.getElementById('tabs').innerHTML = tabDefs().map(function (t) {
          return '<button class="tab' + (t.k === state.tab ? ' is-active' : '') + '" data-k="' + t.k + '">' + t.label + ' (' + t.n + ')</button>';
        }).join('');
      }

      // ---- Bảng ----
      function filtered() {
        return state.tab === 'all' ? deals : deals.filter(function (d) { return d.trang_thai === state.tab; });
      }
      function renderRows() {
        var list = filtered();
        var tb = document.getElementById('dlRows');
        if (!list.length) { tb.innerHTML = '<tr><td colspan="8"><div class="dl-empty">Chưa có deal nào trong mục này.</div></td></tr>'; return; }
        tb.innerHTML = list.map(function (d) {
          var st = ST[d.trang_thai] || ST.coc;
          return '<tr>' +
            '<td><div class="dl-khach"><span class="avatar">' + esc(initials(d.khach)) + '</span>' +
              '<span><span class="dl-khach__n">' + esc(d.khach) + '</span>' +
              '<span class="dl-khach__s">' + esc(d.ngay || '') + '</span></span></div></td>' +
            '<td>' + esc(d.phong || '—') + '</td>' +
            '<td>' + esc(d.toanha || '—') + '</td>' +
            '<td>' + esc(d.sale || '—') + '</td>' +
            '<td class="dl-num">' + fmtVN(d.gia_tri) + 'đ</td>' +
            '<td class="dl-hh">' + fmtVN(d.hh) + 'đ</td>' +
            '<td><span class="badge-st ' + st.cls + '">' + st.label + '</span></td>' +
            '<td style="text-align:right"><button class="dl-more" type="button" data-id="' + d.id + '">⋮</button></td>' +
          '</tr>';
        }).join('');
      }

      function renderAll() { renderKpi(); renderTabs(); renderRows();
        document.getElementById('dlSub').textContent = deals.length + ' deal · ' +
          deals.filter(function (d) { return d.trang_thai === 'chot'; }).length + ' chờ release'; }

      document.getElementById('tabs').addEventListener('click', function (e) {
        var b = e.target.closest('.tab'); if (!b) return;
        state.tab = b.getAttribute('data-k'); renderTabs(); renderRows();
      });

      // ---- Menu ⋮ mỗi deal ----
      var openMenu = null;
      function closeMenu() { if (openMenu) { openMenu.remove(); openMenu = null; } }
      document.addEventListener('click', closeMenu);
      document.getElementById('dlRows').addEventListener('click', function (e) {
        var btn = e.target.closest('.dl-more'); if (!btn) return;
        e.stopPropagation(); closeMenu();
        var id = +btn.getAttribute('data-id');
        var d = deals.filter(function (x) { return x.id === id; })[0]; if (!d) return;
        var menu = document.createElement('div'); menu.className = 'dl-menu';
        var items = '';
        if (d.trang_thai === 'chot') items += '<button type="button" data-act="release">' + I('banknote', 15) + 'Release hoa hồng</button>';
        if (d.trang_thai === 'coc') items += '<button type="button" data-act="chot">' + I('shield-check', 15) + 'Đánh dấu đã chốt</button>';
        items += '<button type="button" data-act="huy">' + I('x', 15) + 'Huỷ deal</button>' +
                 '<button type="button" data-act="del" style="color:var(--danger)">' + I('x', 15) + 'Xoá</button>';
        menu.innerHTML = items;
        document.body.appendChild(menu);
        var r = btn.getBoundingClientRect();
        menu.style.top = (r.bottom + window.scrollY + 4) + 'px';
        menu.style.left = Math.max(8, r.right + window.scrollX - menu.offsetWidth) + 'px';
        openMenu = menu;
        menu.addEventListener('click', function (ev) {
          var mb = ev.target.closest('button'); if (!mb) return;
          ev.stopPropagation(); closeMenu();
          var act = mb.getAttribute('data-act');
          if (act === 'release') return releaseDeal(d);
          if (act === 'chot') return patchStatus(d, 'chot', 'Đã đánh dấu chốt');
          if (act === 'huy') return HT.confirm({ title: 'Huỷ deal', message: 'Huỷ deal của ' + d.khach + '?', danger: true, confirmLabel: 'Huỷ deal', onConfirm: function () { patchStatus(d, 'huy', 'Đã huỷ deal'); } });
          if (act === 'del') return HT.confirm({ title: 'Xoá deal', message: 'Xoá deal của ' + d.khach + '? Không khôi phục được.', danger: true, confirmLabel: 'Xoá', onConfirm: function () { delDeal(d); } });
        });
      });

      function patchStatus(d, st, msg) {
        fetch('/api/deal', { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: d.id, trang_thai: st }) })
          .then(function (r) { return r.json(); }).then(function (res) {
            if (res.error) { HT.toast(res.error, 'danger'); return; }
            HT.toast(msg, 'success'); loadDeals();
          }).catch(function () { HT.toast('Lỗi mạng', 'danger'); });
      }
      function delDeal(d) {
        fetch('/api/deal', { method: 'DELETE', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: d.id }) })
          .then(function (r) { return r.json(); }).then(function (res) {
            if (res.error) { HT.toast(res.error, 'danger'); return; }
            HT.toast('Đã xoá deal', 'success'); loadDeals();
          }).catch(function () { HT.toast('Lỗi mạng', 'danger'); });
      }

      // ---- Modal Release hoa hồng ----
      function releaseDeal(d) {
        HT.modal({
          title: 'Release hoa hồng', sub: d.khach + ' · ' + (d.phong || ''),
          submitLabel: 'Xác nhận release',
          bodyHTML:
            '<div class="mrow"><div class="mfield"><label class="mfield__label">Giá trị deal</label><div>' + fmtVN(d.gia_tri) + 'đ</div></div>' +
            '<div class="mfield"><label class="mfield__label">Hoa hồng release</label><div style="color:var(--gold);font-weight:700">' + fmtVN(d.hh) + 'đ</div></div></div>' +
            '<div class="mfield" style="margin-top:8px;padding:10px 12px;background:var(--warning-soft);border-radius:8px;font-size:13px;color:var(--warning)">Sau khi release, hoa hồng sẽ được ghi nhận vào quỹ và không thể hoàn tác.</div>',
          onSubmit: function (m, close) {
            fetch('/api/deal', { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: d.id, trang_thai: 'release' }) })
              .then(function (r) { return r.json(); }).then(function (res) {
                if (res.error) { HT.toast(res.error, 'danger'); return; }
                close(); HT.toast('Đã release hoa hồng ' + fmtVN(d.hh) + 'đ', 'success'); loadDeals();
              }).catch(function () { HT.toast('Lỗi mạng', 'danger'); });
            return false;
          }
        });
      }

      // ---- Modal Chốt deal mới ----
      document.getElementById('btnAdd').addEventListener('click', function () {
        // nạp toà nhà + sale cho gợi ý (không bắt buộc)
        Promise.all([
          fetch('/api/toa-nha').then(function (r) { return r.json(); }).catch(function () { return {}; }),
          fetch('/api/nhan-vien').then(function (r) { return r.json(); }).catch(function () { return []; })
        ]).then(function (arr) {
          var blds = [].concat((arr[0] && arr[0].ptro) || [], (arr[0] && arr[0].cc) || []);
          var bopts = '<option value="">— Chọn toà nhà —</option>' + blds.map(function (b) { return '<option>' + (b.addr || b.bid) + '</option>'; }).join('');
          var sopts = '<option value="">— Chọn sale —</option>' + (Array.isArray(arr[1]) ? arr[1] : []).map(function (s) { return '<option>' + s.name + '</option>'; }).join('');
          HT.modal({
            title: 'Chốt deal mới', sub: 'Ghi nhận giao dịch chốt phòng', submitLabel: 'Chốt deal', wide: true,
            bodyHTML:
              '<div class="mrow">' +
                '<div class="mfield"><label class="mfield__label">Khách *</label><input id="dK" placeholder="Tên khách"></div>' +
                '<div class="mfield"><label class="mfield__label">Sale phụ trách</label><select id="dS">' + sopts + '</select></div>' +
              '</div>' +
              '<div class="mrow">' +
                '<div class="mfield"><label class="mfield__label">Toà nhà</label><select id="dB">' + bopts + '</select></div>' +
                '<div class="mfield"><label class="mfield__label">Phòng</label><input id="dP" placeholder="VD: P.303"></div>' +
              '</div>' +
              '<div class="mrow">' +
                '<div class="mfield"><label class="mfield__label">Giá trị (đ/tháng) *</label><input id="dG" type="number" placeholder="5000000"></div>' +
                '<div class="mfield"><label class="mfield__label">Hoa hồng (đ)</label><input id="dH" type="number" placeholder="1000000"></div>' +
              '</div>' +
              '<div class="mfield"><label class="mfield__label">Trạng thái</label>' +
                '<select id="dT"><option value="coc">Đang cọc</option><option value="chot">Đã chốt (ký HĐ)</option></select></div>',
            onSubmit: function (m, close) {
              var khach = (m.querySelector('#dK').value || '').trim();
              var gia = parseInt(m.querySelector('#dG').value, 10);
              if (!khach) { HT.toast('Nhập tên khách', 'danger'); return false; }
              if (!gia || gia <= 0) { HT.toast('Nhập giá trị hợp lệ', 'danger'); return false; }
              var payload = {
                khach: khach, sale: m.querySelector('#dS').value, toanha: m.querySelector('#dB').value,
                phong: (m.querySelector('#dP').value || '').trim(), gia_tri: gia,
                hh: parseInt(m.querySelector('#dH').value, 10) || 0,
                trang_thai: m.querySelector('#dT').value,
                ngay: new Date().toLocaleDateString('vi-VN')
              };
              fetch('/api/deal', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) })
                .then(function (r) { return r.json(); }).then(function (res) {
                  if (res.error) { HT.toast(res.error, 'danger'); return; }
                  close(); HT.toast('Đã chốt deal', 'success'); loadDeals();
                }).catch(function () { HT.toast('Lỗi mạng, chưa lưu được', 'danger'); });
              return false;
            }
          });
        });
      });

      loadDeals();
    })();
  </script>
</body>
</html>
